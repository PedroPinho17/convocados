name: CI
on: [push, pull_request]

# Um push novo no mesmo branch cancela o CI anterior, que já não interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Postgres real para os e2e (concorrência das confirmações, fila de espera, convites).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: convocados
          POSTGRES_PASSWORD: convocados
          POSTGRES_DB: convocados
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U convocados -d convocados"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Base de dados descartável do CI; não é um segredo.
      DATABASE_URL: postgres://convocados:convocados@localhost:5432/convocados
      # Web em localhost e API em 127.0.0.1: para o browser são sites diferentes, como a web e
      # a API no Render. Os testes no browser provam que o cookie pelo proxy /api e o socket
      # com token curto funcionam assim. (O build da web inclui o NEXT_PUBLIC_API_URL.)
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      API_URL: http://127.0.0.1:3001
      # Segredo só do CI (não é o de produção).
      PROXY_SECRET: segredo-do-proxy-so-para-o-ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Testes unitários e de componentes (shared, API, web, mobile)
        run: pnpm test:cov
      - name: Build (API e web)
        run: pnpm build
      - name: Testes e2e da API (Postgres)
        run: pnpm test:e2e:cov
      - name: Resumo da cobertura
        if: always()
        run: pnpm coverage:summary
      - name: Migrações batem certo com as entidades
        run: pnpm migration:check
      - name: Instalar o Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Testes no browser (web + API + Postgres)
        run: pnpm test:browser
      - name: Relatório do Playwright (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
