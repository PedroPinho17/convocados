name: CI
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    # Postgres real para os e2e (concorrência das confirmações, fila de espera, convites).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: convocados
          POSTGRES_PASSWORD: convocados
          POSTGRES_DB: convocados
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U convocados -d convocados"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Base de dados descartável do CI; não é um segredo.
      DATABASE_URL: postgres://convocados:convocados@localhost:5432/convocados
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
